name: Check playbook
on:
  pull_request:
  push:
    branches: [codex/playbook-visual-refresh]
permissions:
  contents: read
jobs:
  build-and-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: python3 -m unittest discover -s scripts
      - run: npm run check:links
